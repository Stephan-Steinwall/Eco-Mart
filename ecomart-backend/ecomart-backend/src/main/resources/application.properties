spring.application.name=ecomart-backend

server.port=8080

# Datasource connection details (URL/username/password) live in the gitignored
# application-local.properties so real credentials never get committed.
# See application-local.properties.example for the template.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Supabase runs Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
